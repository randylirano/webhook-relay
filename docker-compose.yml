services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      # 5433 on the host so it can run alongside ledger-api's Postgres on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay -d relay']
      interval: 2s
      timeout: 3s
      retries: 20

  relay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      PORT: 3000
      API_KEY: ${API_KEY:-dev-api-key-change-me-0123456789}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - '3000:3000'

volumes:
  pgdata:
